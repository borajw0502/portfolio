<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: monospace;
    cursor: none;
  }

  #cursor {
    position: fixed;
    width: 10px; height: 10px;
    background: #f0ede6;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
    transition: width 0.2s ease, height 0.2s ease, opacity 0.2s ease;
  }

  /* 뷰포트: 항상 화면 중앙, 비율 유지 (letterbox) */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    overflow: hidden;
  }

  #viewport {
    position: relative;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    overflow: visible;
    flex-shrink: 0;
    pointer-events: auto;
  }

  /* 슬라이드 */
  .slide {
    position: absolute;
    inset: 0;
    display: none;
  }
  .slide.active  { display: block; z-index: 2; }
  .slide.leaving { display: block; z-index: 1; }

  /* PNG 배경 — 1920×1080 고정, 피그마 좌표와 1:1 */
  .slide-bg {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    background-size: 1920px 1080px;
    background-position: 0 0;
    background-repeat: no-repeat;
  }

  /* 미디어/링크 오버레이 — position:absolute, 좌표는 피그마 px 그대로 */
  .media-overlay {
    position: absolute;
    overflow: hidden;
    z-index: 10;
  }
  .media-overlay video,
  .media-overlay img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    pointer-events: none;
  }
  .media-overlay video::-webkit-media-controls { display: none !important; }
  .media-overlay video::--webkit-media-controls-enclosure { display: none !important; }
  .media-overlay video::-webkit-media-controls-overlay-play-button { display: none !important; }
  .media-overlay .lottie-wrap {
    width: 100%;
    height: 100%;
  }

  /* 링크 오버레이 */
  .link-overlay {
    position: fixed;
    display: block;
    background: transparent;
    z-index: 100;
    cursor: pointer;
    pointer-events: auto;
  }

  /* 슬라이드 전환 애니메이션 */
  .anim-in-right, .anim-in-left   { /* 컷 전환 — 애니메이션 없음 */ }
  .anim-out-left, .anim-out-right { /* 컷 전환 — 애니메이션 없음 */ }



  /* UI */
  #ui {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 200;
    background: rgba(10,10,10,0.4);

    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  #ui.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #ui button {
    background: none; border: none; cursor: none;
    color: rgba(240,237,230,0.4);
    font-size: 16px; padding: 3px 7px;
    transition: color 0.2s;
  }
  #ui button:hover { color: #f0ede6; }
  #counter-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #counter {
    font-size: 11px; letter-spacing: 0.1em;
    color: rgba(240,237,230,0.7);
    width: 28px; text-align: center;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 5px;
    padding: 3px 4px;
    outline: none;
    font-family: monospace;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    -moz-appearance: textfield;
  }
  #counter::-webkit-inner-spin-button,
  #counter::-webkit-outer-spin-button { -webkit-appearance: none; }
  #counter:hover {
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.12);
    color: rgba(240,237,230,0.9);
  }

  }

// ================================================================
const VP_W = 1920, VP_H = 1080;

const viewport  = document.getElementById('viewport');
const dotsEl    = document.getElementById('dots');
const counter   = document.getElementById('counter');
const slideNum  = document.getElementById('slide-num');
const progress  = document.getElementById('progress');
const loadingEl = document.getElementById('loading');

let current   = 0;
let animating = false;
const total   = SLIDES.length;

// ── 뷰포트 스케일 ───────────────────────────────────────
let currentScale = 1;
let offsetX = 0, offsetY = 0;

function scaleViewport() {
  currentScale = Math.min(window.innerWidth / VP_W, window.innerHeight / VP_H);
  viewport.style.width  = VP_W + 'px';
  viewport.style.height = VP_H + 'px';
  viewport.style.transform = `scale(${currentScale})`;
  document.getElementById('stage').style.background = '#0a0a0a';

  // viewport 실제 화면상 위치 계산
  const scaledW = VP_W * currentScale;
  const scaledH = VP_H * currentScale;
  offsetX = (window.innerWidth  - scaledW) / 2;
  offsetY = (window.innerHeight - scaledH) / 2;

  updateLinkPositions();
}

function updateLinkPositions() {
  document.querySelectorAll('.link-overlay').forEach(a => {
    const si = parseInt(a.dataset.slideIdx);
    const top    = parseFloat(a.dataset.top)    * currentScale + offsetY;
    const left   = parseFloat(a.dataset.left)   * currentScale + offsetX;
    const width  = parseFloat(a.dataset.width)  * currentScale;
    const height = parseFloat(a.dataset.height) * currentScale;
    a.style.cssText = `top:${top}px;left:${left}px;width:${width}px;height:${height}px;`;
    // 현재 슬라이드만 pointer-events 활성화
    a.style.pointerEvents = (si === current) ? 'auto' : 'none';
    a.style.display = (si === current) ? 'block' : 'none';
  });
}

window.addEventListener('resize', scaleViewport);
scaleViewport();

// ── 슬라이드 DOM 생성 ───────────────────────────────────
const slideEls = [];
const lottieAnims = []; // {slideIdx, anim}

SLIDES.forEach((data, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');

  // 배경 PNG
  const bg = document.createElement('div');
  bg.className = 'slide-bg';
  bg.style.backgroundImage = `url('${data.bg}')`;
  slide.appendChild(bg);

  // 미디어
  (data.media || []).forEach((m, mi) => {
    const wrap = document.createElement('div');
    wrap.className = 'media-overlay';
    wrap.style.cssText = `top:${m.top}px;left:${m.left}px;width:${m.width}px;height:${m.height}px;`;

    if (m.type === 'video') {
      const v = document.createElement('video');
      v.src = m.src;
      v.loop = true; v.muted = true; v.playsInline = true;
      v.autoplay = (i === 0);  // 첫 슬라이드만 즉시 재생
      wrap.appendChild(v);

    } else if (m.type === 'lottie') {
      const div = document.createElement('div');
      div.className = 'lottie-wrap';
      wrap.appendChild(div);
      // 로티는 나중에 초기화 (아래에서)
      wrap.dataset.lottieIdx = mi;
      wrap.dataset.lottieSlide = i;

    } else { // gif
      const img = document.createElement('img');
      img.src = m.src; img.alt = '';
      wrap.appendChild(img);
    }
    slide.appendChild(wrap);
  });

  // 링크 — 나중에 fixed 레이어에 추가 (scale 보정)
  (data.links || []).forEach(l => {
    const a = document.createElement('a');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = 'link-overlay';
    a.dataset.slideIdx = i;
    a.dataset.top    = l.top;
    a.dataset.left   = l.left;
    a.dataset.width  = l.width;
    a.dataset.height = l.height;
    a.addEventListener('click', e => e.stopPropagation());
    document.body.appendChild(a);
  });

  viewport.appendChild(slide);
  slideEls.push(slide);
});

// ── 로티 초기화 ─────────────────────────────────────────
// 로티 초기화 — 슬라이드별 media 배열 직접 순회
SLIDES.forEach((data, i) => {
  let lottieMediaIndex = 0;
  (data.media || []).forEach((m) => {
    if (m.type !== 'lottie') return;

    const slideEl  = slideEls[i];
    // lottie-wrap 컨테이너를 순서대로 찾기
    const allLottieWraps = slideEl.querySelectorAll('.lottie-wrap');
    const container = allLottieWraps[lottieMediaIndex];
    lottieMediaIndex++;

    if (!container) return;

    const wrap = container.parentElement;
    const isHoverOnly = (i === 21);

    const anim = lottie.loadAnimation({
      container,
      renderer: 'svg',
      loop:     !isHoverOnly,
      autoplay: false,
      path:     m.src,
    });
    lottieAnims.push({ slideIdx: i, anim, hoverOnly: isHoverOnly });

    if (isHoverOnly) {
      wrap.style.transition      = 'transform 0.25s ease';
      wrap.style.transformOrigin = 'center center';
      wrap.addEventListener('mouseenter', () => {
        anim.goToAndPlay(0);
        wrap.style.transform   = 'scale(1.15)';
        cursor.style.width     = '36px';
        cursor.style.height    = '36px';
        cursor.style.opacity   = '0.4';
      });
      wrap.addEventListener('mouseleave', () => {
        anim.stop();
        wrap.style.transform   = 'scale(1)';
        cursor.style.width     = '10px';
        cursor.style.height    = '10px';
        cursor.style.opacity   = '1';
      });
    }
  });
});

// 로딩 화면 즉시 제거
loadingEl.style.opacity = '0';
setTimeout(() => loadingEl.style.display = 'none', 300);

// ── UI ──────────────────────────────────────────────────
const cursor = document.getElementById('cursor');

// 링크 오버레이 컨테이너 (fixed, viewport 밖 — scale 무관)
const linkContainer = document.createElement('div');
linkContainer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:100;';
document.body.appendChild(linkContainer);

function updateLinkOverlays() {
  linkContainer.innerHTML = '';
  const data = SLIDES[current];
  (data.links || []).forEach(l => {
    const a = document.createElement('a');
    a.href = l.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    const x = offsetX + l.left * currentScale;
    const y = offsetY + l.top  * currentScale;
    const w = l.width  * currentScale;
    const h = l.height * currentScale;
    a.className = 'link-overlay';
    a.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;pointer-events:auto;display:block;background:transparent;`;
    a.addEventListener('click', e => e.stopPropagation());
    a.addEventListener('mouseenter', () => {
      cursor.style.width   = '36px';
      cursor.style.height  = '36px';
      cursor.style.opacity = '0.4';
    });
    a.addEventListener('mouseleave', () => {
      cursor.style.width   = '10px';
      cursor.style.height  = '10px';
      cursor.style.opacity = '1';
    });
    linkContainer.appendChild(a);
  });
}

function buildDots() {}

function updateUI() {
  counter.value = current + 1;
  document.getElementById('total-label').textContent = `/ ${total}`;
  if (typeof updateLinkOverlays === 'function') updateLinkOverlays();
  // URL hash 업데이트 (초기 로드 완료 후에만)
  if (hashReady) {
    history.replaceState(null, '', '#' + (current + 1));
  }
}

// ── 슬라이드 전환 ────────────────────────────────────────
// UI 자동 숨김
let uiTimer = null;
let keyHintShown = false;
function showUI() {
  const ui = document.getElementById('ui');
  const keyHint = document.getElementById('key-hint');
  ui.classList.add('visible');
  // 처음 한 번만 key-hint 표시
  if (!keyHintShown && keyHint) {
    keyHint.style.opacity = '1';
    keyHintShown = true;
  }
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => {
    if (document.activeElement !== counter) {
      ui.classList.remove('visible');
      if (keyHint) keyHint.style.opacity = '0';
    }
  }, 6000);
}

function goTo(idx, dir) {
  if (animating || idx === current || idx < 0 || idx >= total) return;
  animating = true;
  if (dir === undefined) dir = idx > current ? 1 : -1;

  const prevEl = slideEls[current];
  const nextEl = slideEls[idx];

  // 현재 슬라이드 영상/로티 정지
  prevEl.querySelectorAll('video').forEach(v => v.pause());
  lottieAnims.filter(a => a.slideIdx === current && !a.hoverOnly).forEach(a => a.anim.pause());

  // 다음 슬라이드 PNG 미리 로드 보장
  const nextBg = SLIDES[idx].bg;
  const preload = new Image();
  preload.onload = preload.onerror = () => {
    prevEl.classList.add(dir > 0 ? 'anim-out-left' : 'anim-out-right');
    prevEl.classList.add('leaving');
    nextEl.classList.add(dir > 0 ? 'anim-in-right' : 'anim-in-left');
    nextEl.classList.add('active');

    // 다음 슬라이드 영상/로티 재생
    nextEl.querySelectorAll('video').forEach(v => { v.currentTime = 0; v.play(); });
    lottieAnims.filter(a => a.slideIdx === idx && !a.hoverOnly).forEach(a => { a.anim.goToAndPlay(0); });

    setTimeout(() => {
      prevEl.classList.remove('active', 'leaving', 'anim-out-left', 'anim-out-right');
      nextEl.classList.remove('anim-in-right', 'anim-in-left');
      current = idx;
      updateUI();
      animating = false;
    }, 0);
  };
  preload.src = nextBg;
}

const next = () => goTo(current + 1,  1);
const prev = () => goTo(current - 1, -1);

// ── 이벤트 ──────────────────────────────────────────────
document.getElementById('btn-next').addEventListener('click', next);
document.getElementById('btn-prev').addEventListener('click', prev);

document.addEventListener('keydown', e => {
  if (['ArrowRight', ' '].includes(e.key)) { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft')               { e.preventDefault(); prev(); }
});

let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
});

document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';

  const overInteractive = e.target.closest('.link-overlay, button, .dot') || e.target.closest('#link-container a');
  if (overInteractive) {
    cursor.style.width   = '36px';
    cursor.style.height  = '36px';
    cursor.style.opacity = '0.4';
  } else {
    cursor.style.width   = '10px';
    cursor.style.height  = '10px';
    cursor.style.opacity = '1';
  }
});

// ── 초기화 ──────────────────────────────────────────────
// 페이지 번호 직접 입력
counter.addEventListener('click', () => {
  counter.readOnly = false;
  counter.value = current + 1;
  counter.select();
  clearTimeout(uiTimer);
});

counter.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = parseInt(counter.value);
    counter.readOnly = true;
    counter.blur();
    if (!isNaN(val) && val >= 1 && val <= total) {
      goTo(val - 1);
    } else {
      counter.value = current + 1;
  document.getElementById('total-label').textContent = `/ ${total}`;
    }
    showUI();
  }
  if (e.key === 'Escape') {
    counter.readOnly = true;
    counter.value = current + 1;
  document.getElementById('total-label').textContent = `/ ${total}`;
    counter.blur();
    showUI();
  }
  e.stopPropagation();
});

counter.addEventListener('blur', () => {
  const val = parseInt(counter.value);
  counter.readOnly = true;
  if (!isNaN(val) && val >= 1 && val <= total) {
    goTo(val - 1);
  } else {
    counter.value = current + 1;
  }
  document.getElementById('total-label').textContent = `/ ${total}`;
});

// 마우스가 하단 10% 진입시 UI 표시
document.addEventListener('mousemove', e => {
  if (e.clientY > window.innerHeight * 0.9) {
    if (document.activeElement !== counter) showUI();
  }
});

// UI 바 위에 마우스 있을 때 사라지지 않게
const uiEl = document.getElementById('ui');
uiEl.addEventListener('mouseenter', () => clearTimeout(uiTimer));
uiEl.addEventListener('mouseleave', () => {
  if (document.activeElement !== counter) {
    uiTimer = setTimeout(() => uiEl.classList.remove('visible'), 1000);
  }
});

buildDots();
updateUI();

// URL hash로 특정 페이지 바로가기 (예: portfolio.html#22)
// window.onload 이후 실행 보장
var hashReady = false;
window.addEventListener('load', () => {
  const hashPage = parseInt(window.location.hash.replace('#', ''));
  if (!isNaN(hashPage) && hashPage >= 1 && hashPage <= total) {
    slideEls.forEach(el => el.classList.remove('active', 'leaving'));
    current = hashPage - 1;
    slideEls[current].classList.add('active');
    slideEls[current].querySelectorAll('video').forEach(v => v.play());
    // 로티도 재생
    lottieAnims.filter(a => a.slideIdx === current && !a.hoverOnly).forEach(a => a.anim.goToAndPlay(0));
    // 첫 슬라이드 영상/로티 정지
    slideEls[0].querySelectorAll('video').forEach(v => v.pause());
    lottieAnims.filter(a => a.slideIdx === 0 && !a.hoverOnly).forEach(a => a.anim.stop());
  }
  hashReady = true;
  updateUI();
});

// 처음 로드시 잠깐 보여주기
setTimeout(showUI, 500);
slideEls[0].querySelectorAll('video').forEach(v => v.play());
lottieAnims.filter(a => a.slideIdx === 0 && !a.hoverOnly).forEach(a => a.anim.play());
</script>
</body>
</html>
